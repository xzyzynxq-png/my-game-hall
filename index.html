const HALL_SETTINGS = {
  title: '我的APP',          // 大厅名称
  skiBaseSpeed: 160,         // 滑雪基础速度，越大越快；左右速度与45°角同步

  flapGap: 180,              // 小鸟初始间隙，越大越容易，建议不低于145
  // 入口顺序。删除项目可隐藏游戏，加回来即可恢复。
  enabledGames: [
    'memory', 'ski', 'merge', 'snake', 'tetris', 'bricks',
    'mines', 'four', 'flap', 'whack', 'soko', 'slide',
    'ttt', 'simon', 'react', 'lights', 'peg', 'gomoku', 'nim', 'queens',
    'sudoku', 'maze', 'picross', 'code', 'pong', 'catch', 'flood',
    'hanoi', 'watersort', 'reversi', 'dots', 'mancala', 'draughts', 'findships', 'numberpath', 'guessnum', 'twentyfour', 'arithmetic', 'seq', 'scramble', 'wordguess', 'typing', 'rhythm', 'crossroad', 'hurdles', 'minigolf', 'kenken', 'magic', 'rectpuzzle', 'wordsearch'
  ]
};
</script>
<script>// 记忆配对、滑雪、菜单路由。
const hall=document.querySelector('#hall'),tool=document.querySelector('#tool'),content=document.querySelector('#content');
let timer,tick,deck=[],selected=[],matched=0,moves=0,seconds=0,active=false,level=12;
function stop(){
  stopMini();
  stopGames();
  ski.running=false;
  cancelAnimationFrame(skiFrame);
  clearTimeout(timer);
  clearInterval(tick);
  active=false
}
function back(){
  stop();
  document.body.classList.remove('ski-mode','play-mode');
  hall.hidden=false;
  tool.hidden=true
}
function openTool(type){
  stop();
  document.body.classList.toggle('ski-mode',type==='ski');
  document.body.classList.toggle('play-mode',type!=='ski'&&type!=='memory');
  hall.hidden=true;
  tool.hidden=false;
  document.querySelector('#title').textContent=type==='memory'?'记忆配对':type==='ski'?'滑雪':(MINI_GAMES[type]||GAME_INFO[type]).name;
  if(type==='memory')memoryMenu();
  else if(type==='ski')skiMenu();
  else if(MINI_GAMES[type])miniMenu(type);
  else gameMenu(type)
}
function today(){
  let d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]]
  }return a
}const timeOptions={
  8:[50,60,70],12:[65,80,95],18:[85,105,125]
};
let chosenTime=80;
function memoryMenu(){
  content.innerHTML='<p>先选配对组数，再选挑战时间。开局看牌 3 秒，不计入挑战时间。</p><label>配对组数 <select id="difficulty" onchange="updateTimes()"><option value="8">8 组</option><option value="12" selected>12 组</option><option value="18">18 组</option></select></label> <label>挑战时间 <select id="limit"></select></label><p><button class="action" onclick="beginMemory()">开始挑战</button></p>';
  updateTimes()
}function updateTimes(){
  let n=Number(document.querySelector('#difficulty').value);
  document.querySelector('#limit').innerHTML=timeOptions[n].map((t,i)=>'<option value="'+t+'" '+(i===1?'selected':'')+'>'+t+' 秒</option>').join('')
}function beginMemory(){
  chosenTime=Number(document.querySelector('#limit').value);
  startMemory(Number(document.querySelector('#difficulty').value))
}function startMemory(n){
  stop();
  level=n;
  let symbols=['🍋','🍊','🍎','🍒','🍓','🍇','🥝','🍉','🍐','🍑','🥭','🍍','🥥','🫐','🥑','🌽','🥕','🍆'].slice(0,n);
  deck=shuffle([...symbols,...symbols]);
  selected=[];
  matched=0;
  moves=0;
  seconds=chosenTime;
  content.innerHTML='<p id="score">记住位置：3 秒后盖牌。</p><div class="cards">'+deck.map((v,i)=>'<button class="card" aria-label="第 '+(i+1)+' 张牌" onclick="flip('+i+')">'+v+'</button>').join('')+'</div><button class="action" onclick="startMemory(level)">重新开始</button><button class="action secondary" onclick="stop();memoryMenu()">选择难度</button>';
  timer=setTimeout(()=>{
    content.querySelectorAll('.card').forEach(c=>c.textContent='?');active=true;score();tick=setInterval(()=>{
      seconds--;if(seconds<=0){
        active=false;clearInterval(tick);content.querySelectorAll('.card').forEach((c,i)=>c.textContent=deck[i])
      }score()
    },1000)
  },3000)
}function score(){
  document.querySelector('#score').textContent=matched===level?'通关！剩余 '+seconds+' 秒 · '+moves+' 次尝试':seconds<=0?'时间到！找到 '+matched+'/'+level+' 组':'剩余 '+seconds+' 秒 · '+matched+'/'+level+' 组 · '+moves+' 次尝试'
}function flip(i){
  let cards=content.querySelectorAll('.card');
  if(!active||selected.length===2||cards[i].classList.contains('done')||selected.includes(i))return;
  cards[i].textContent=deck[i];
  selected.push(i);
  if(selected.length===2){
    moves++;
    let[a,b]=selected;
    if(deck[a]===deck[b]){
      cards[a].classList.add('done');
      cards[b].classList.add('done');
      matched++;
      selected=[];
      if(matched===level){
        active=false;
        clearInterval(tick)
      }
    }else timer=setTimeout(()=>{
      if(seconds>0){
        cards[a].textContent='?';cards[b].textContent='?'
      }selected=[]
    },650);
    score()
  }
}
let skiFrame=0,ski={
  running:false
},skiResize,skiRate=HALL_SETTINGS.skiDefaultRate;
function skiMenu(){
  content.innerHTML='<p>点击雪道或按空格，切换左下／右下方向。每秒 +1 分，礼物 +1～5 分。撞树或雪道边界即结束。</p><div class="ski-hud"><span id="ski-time">0 秒</span><span id="ski-score">0 分</span><span id="ski-level">第 1 段</span><label>倍速 <select id="ski-speed" onchange="skiRate=Number(this.value)"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div><div class="ski-stage" id="ski-stage"><canvas id="ski-canvas" tabindex="0" aria-label="滑雪游戏，点击或空格换方向"></canvas><div class="ski-overlay" id="ski-overlay"><h3>滑雪</h3><p>小人固定在画面上方，雪道向后移动。<br>横屏、竖屏都能玩。</p><button class="action" onclick="startSki()">开始滑雪</button></div></div><button class="action secondary ski-pause" onclick="pauseSki()">暂停</button>';
  document.querySelector('#ski-speed').value=String(skiRate);
  let canvas=document.querySelector('#ski-canvas');
  canvas.addEventListener('pointerdown',e=>{
    e.preventDefault();turnSki()
  });
  canvas.addEventListener('keydown',e=>{
    if(e.code==='Space'){
      e.preventDefault();if(!e.repeat)turnSki()
    }
  });
  if(skiResize)skiResize.disconnect();
  skiResize=new ResizeObserver(()=>resizeSki());
  skiResize.observe(document.querySelector('#ski-stage'));
  resizeSki()
}
function resizeSki(){
  let canvas=document.querySelector('#ski-canvas');
  if(!canvas)return;
  let r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(r.width*dpr);
  canvas.height=Math.round(r.height*dpr);
  ski.h=600*r.height/r.width;
  ski.ctx=canvas.getContext('2d');
  ski.ctx.setTransform(canvas.width/600,0,0,canvas.height/ski.h,0,0);
  if(!ski.running)drawSki()
}
function dailyRandom(){
  let seed=2166136261;
  for(let c of today())seed=Math.imul(seed^c.charCodeAt(0),16777619);
  return()=>{
    seed+=0x6D2B79F5;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t^=t+Math.imul(t^t>>>7,61|t);
    return((t^t>>>14)>>>0)/4294967296
  }
}
function startSki(){
  cancelAnimationFrame(skiFrame);
  let ctx=ski.ctx,h=ski.h;
  ski={
    ctx,h,running:true,paused:false,x:300,y:0,dir:1,time:0,bonus:0,objects:[],trail:[{
      x:300,y:-80
    },{
      x:300,y:0
    }],trailClock:0,spawn:0,nextRow:180,random:dailyRandom(),last:0
  };
  generateSkiRows(ski.h);
  document.querySelector('#ski-overlay').hidden=true;
  document.querySelector('#ski-canvas').focus({
    preventScroll:true
  });
  skiFrame=requestAnimationFrame(skiLoop)
}
function turnSki(){
  if(ski.running&&!ski.paused)ski.dir*=-1
}
function pauseSki(){
  if(!ski.running)return;
  ski.paused=true;
  document.querySelector('#ski-overlay').hidden=false;
  document.querySelector('#ski-overlay').innerHTML='<h3>已暂停</h3><p>计时和场景已暂停。</p><button class="action" onclick="resumeSki()">继续滑雪</button><button class="action secondary" onclick="startSki()">重新开始</button>'
}
function resumeSki(){
  ski.paused=false;
  ski.last=0;
  document.querySelector('#ski-overlay').hidden=true
}
function endSki(reason){
  ski.running=false;
  document.querySelector('#ski-overlay').hidden=false;
  document.querySelector('#ski-overlay').innerHTML='<h3>'+reason+'</h3><p>坚持 '+Math.floor(ski.time)+' 秒 · 得分 '+(Math.floor(ski.time)+ski.bonus)+'<br>到达第 '+(1+Math.floor(ski.time/20))+' 段</p><button class="action" onclick="startSki()">再滑一次</button>';
  drawSki()
}
function skiRhythm(y){
  let phase=Math.floor(Math.max(0,y)/1600)%4;
  return[{
    name:'轻松雪道',spacing:240,trees:1
  },{
    name:'树林挑战',spacing:160,trees:2
  },{
    name:'缓冲雪道',spacing:220,trees:1
  },{
    name:'礼物休息段',spacing:300,trees:0
  }][phase]
}
function generateSkiRows(ahead){
  while(ski.nextRow<ahead+100){
    let y=ski.nextRow,r=skiRhythm(y),safe=140+ski.random()*320,placed=[];
    for(let i=0;i<r.trees;i++){
      let x;
      for(let attempt=0;attempt<50;attempt++){
        x=40+ski.random()*520;
        if(Math.abs(x-safe)>95&&placed.every(p=>Math.abs(p-x)>75))break;
        x=null
      }if(x!==null){
        placed.push(x);
        ski.objects.push({
          x,y,type:'tree'
        })
      }
    }if(r.trees===0||ski.random()<.6)ski.objects.push({
      x:safe,y:y+65,type:'gift',value:1+Math.floor(ski.random()*5)
    });
    ski.nextRow+=r.spacing
  }
}
function skiVelocity(dir){
  return {
    x:dir*HALL_SETTINGS.skiBaseSpeed*skiRate,y:HALL_SETTINGS.skiBaseSpeed*skiRate
  }
}function skiStep(dt){
  ski.time+=dt;
  let v=skiVelocity(ski.dir);
  ski.x+=v.x*dt;
  ski.y+=v.y*dt;
  ski.trailClock=(ski.trailClock||0)+dt;
  if(ski.trailClock>=.025){
    ski.trailClock=0;
    ski.trail.push({
      x:ski.x,y:ski.y
    });
    ski.trail=ski.trail.filter(p=>p.y>ski.y-250)
  }if(ski.x<=16||ski.x>=584){
    endSki('撞到雪道边界');
    return
  }generateSkiRows(ski.y+ski.h);
  for(let o of ski.objects){
    if(Math.hypot(o.x-ski.x,o.y-ski.y)<(o.type==='tree'?26:25)){
      if(o.type==='tree'){
        endSki('撞到树了');
        return
      }ski.bonus+=o.value;
      o.taken=true
    }
  }ski.objects=ski.objects.filter(o=>!o.taken&&o.y>ski.y-150)
}
function skiLoop(now){
  if(!ski.running)return;
  if(!ski.paused){
    let dt=ski.last?Math.min((now-ski.last)/1000,.05):0;
    ski.last=now;
    while(dt>0&&ski.running){
      let step=Math.min(dt,.012);
      skiStep(step);
      dt-=step
    }drawSki();
    document.querySelector('#ski-time').textContent=Math.floor(ski.time)+' 秒';
    document.querySelector('#ski-score').textContent=(Math.floor(ski.time)+ski.bonus)+' 分';
    document.querySelector('#ski-level').textContent='第 '+(1+Math.floor(ski.time/20))+' 段 · '+skiRhythm(ski.y).name
  }if(ski.running)skiFrame=requestAnimationFrame(skiLoop)
}

function drawSki(){
  let c=ski.ctx;
  if(!c)return;
  let h=ski.h,px=300,py=Math.min(120,h*.16),wx=ski.x??300,wy=ski.y??0,left=300-wx,right=left+600;
  c.fillStyle='#d9ecf4';
  c.fillRect(0,0,600,h);
  c.fillStyle='#f7fcff';
  c.fillRect(left,0,600,h);
  c.strokeStyle='#77a6c1';
  c.lineWidth=8;
  c.setLineDash([24,16]);
  c.beginPath();
  c.moveTo(left,0);
  c.lineTo(left,h);
  c.moveTo(right,0);
  c.lineTo(right,h);
  c.stroke();
  c.setLineDash([]);
  c.lineCap='round';
  c.lineJoin='round';
  for(let width of [12,5]){
    c.lineWidth=width;
    c.strokeStyle=width===12?'#d8e5ec':'#b5ccd9';
    c.beginPath();
    (ski.trail||[]).forEach((p,i)=>{
      let x=px+p.x-wx,y=py+p.y-wy+12;i?c.lineTo(x,y):c.moveTo(x,y)
    });
    c.lineTo(px,py+12);
    c.stroke()
  }c.textAlign='center';
  c.textBaseline='middle';
  for(let o of ski.objects||[]){
    let x=px+o.x-wx,y=py+o.y-wy;
    if(y< -60||y>h+60)continue;
    c.font=o.type==='tree'?'48px system-ui':'32px system-ui';
    c.fillText(o.type==='tree'?'🌲':'🎁',x,y)
  }if(skierImage.complete&&skierImage.naturalWidth){
    c.save();
    c.translate(px,py-12);
    if((ski.dir||1)<0)c.scale(-1,1);
    c.drawImage(skierImage,-48,-65,96,96);
    c.restore()
  }
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&ski.running&&!ski.paused)pauseSki()
});

<script>// 新游戏在 MINI_GAMES 中登记。规则函数收到独立的界面与计时工具。
const MINI_GAMES={};
function miniRegister(id,name,icon,help,start){MINI_GAMES[id]={name,icon,help,start}}
let miniSession;
function stopMini(){if(miniSession){miniSession.stop();miniSession=null}}
function miniMenu(id){
  const def=MINI_GAMES[id];
  content.innerHTML='<p class="game-intro">'+def.help+'</p><div class="mini-board"><p id="mini-message" class="mini-message" aria-live="polite"></p><div id="mini-stage"></div><button class="action" id="mini-restart">重新开始</button></div>';
  const stage=document.querySelector('#mini-stage'),message=document.querySelector('#mini-message');
  const timers=new Set();let dead=false,frame=0,action=()=>{},keyboard=()=>{};
  const key=e=>{if(e.target?.closest?.('input,select,textarea'))return;if(keyboard(e.key))e.preventDefault()};
  const ctx={stage,
    show(msg,html,fn=()=>{}){if(dead)return;message.textContent=msg;stage.innerHTML=html;action=fn},
    say(msg){if(!dead)message.textContent=msg},
    delay(fn,ms){const id=setTimeout(()=>{timers.delete(id);if(!dead)fn()},ms);timers.add(id)},
    keys(fn){keyboard=fn},
    animate(fn){let last=0;const loop=t=>{if(dead)return;const dt=last?Math.min((t-last)/1000,.04):0;last=t;if(fn(dt,t)!==false)frame=requestAnimationFrame(loop)};frame=requestAnimationFrame(loop)},
    stop(){dead=true;for(const timer of timers)clearTimeout(timer);timers.clear();cancelAnimationFrame(frame);document.removeEventListener('keydown',key)}
  };
  miniSession=ctx;
  stage.addEventListener('click',e=>{const b=e.target.closest('button[data-mini]');if(b&&!b.disabled&&!dead)action(b.dataset.mini)});
  document.querySelector('#mini-restart').addEventListener('click',()=>{stopMini();miniMenu(id)});
  document.addEventListener('keydown',key);
  def.start(ctx);
}
function mbutton(label,id,classes='',disabled=false,style=''){return '<button type="button" data-mini="'+id+'" class="'+classes+'"'+(style?' style="'+style+'"':'')+(disabled?' disabled':'')+'>'+label+'</button>'}
function mgrid(n,buttons){return '<div class="mini-grid" style="--cols:'+n+'">'+buttons.join('')+'</div>'}
function mrand(n){return Math.floor(Math.random()*n)}
const MDIR={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
function madj(i,n,h=n){const x=i%n,y=Math.floor(i/n);return Object.values(MDIR).map(([dx,dy])=>[x+dx,y+dy]).filter(([x,y])=>x>=0&&x<n&&y>=0&&y<h).map(([x,y])=>y*n+x)}
function mline(board,i,n,count){let v=board[i];if(!v)return false;const x=i%n,y=Math.floor(i/n);return [[1,0],[0,1],[1,1],[1,-1]].some(([dx,dy])=>{let k=1;for(const s of [-1,1])for(let d=1;d<count;d++){const a=x+d*dx*s,b=y+d*dy*s;if(a<0||a>=n||b<0||b>=n||board[b*n+a]!==v)break;k++}return k>=count})}
miniRegister('ttt','井字棋','❎','你是叉，电脑是圈。横、竖或斜线先连成三个获胜。',u=>{
  const b=Array(9).fill(0);let busy=false,done='';
  function choose(v){for(let i=0;i<9;i++)if(!b[i]){b[i]=v;const win=mline(b,i,3,3);b[i]=0;if(win)return i}return -1}
  function draw(){u.show(done||(busy?'电脑落子中':'轮到你了'),mgrid(3,b.map((v,i)=>mbutton(['·','×','○'][v],i,'mcell',!!(v||busy||done)))),play)}
  function play(k){const i=+k;if(busy||done||b[i])return;b[i]=1;if(mline(b,i,3,3))done='你赢了！';else if(b.every(Boolean))done='平局';else{busy=true;u.delay(()=>{let j=choose(2);if(j<0)j=choose(1);if(j<0)j=[4,0,2,6,8,1,3,5,7].find(k=>!b[k]);b[j]=2;busy=false;if(mline(b,j,3,3))done='电脑赢了';else if(b.every(Boolean))done='平局';draw()},350)}draw()}draw()
});
miniRegister('simon','灯光顺序','🎵','记住灯亮的顺序，再按同样的顺序点。每轮多一格。',u=>{
  const seq=[];let pos=0,mode='ready',lit=-1;
  const colors=['#4588cb','#c55e6a','#51a07b','#ba8b44'];
  function draw(msg){u.show(msg,mgrid(2,colors.map((c,i)=>mbutton(['蓝','红','绿','黄'][i],i,'mcell',mode!=='input','background:'+c+';opacity:'+(i===lit?1:.7))))+(mode==='ready'?mbutton('开始记忆','start','action'):''),tap)}
  function round(){seq.push(mrand(4));pos=0;mode='watch';draw('第 '+seq.length+' 轮：看灯');seq.forEach((v,i)=>{u.delay(()=>{lit=v;draw('记住顺序')},650*i+250);u.delay(()=>{lit=-1;draw('记住顺序')},650*i+700)});u.delay(()=>{mode='input';draw('轮到你，按顺序点')},650*seq.length+200)}
  function tap(k){if(k==='start'&&mode==='ready')return round();if(mode!=='input')return;if(+k!==seq[pos]){mode='end';draw('顺序错了，已完成 '+(seq.length-1)+' 轮');return}if(++pos===seq.length){mode='watch';draw('正确！');u.delay(round,650)}else draw('已输入 '+pos+' / '+seq.length)}draw('准备好了就开始')
});
miniRegister('react','反应挑战','⏱️','等到按钮变绿再点。抢点会失败。每局测五次，取平均时间。',u=>{
  let state='ready',stamp=0,results=[];
  function draw(msg){u.show(msg,mbutton(state==='wait'?'等待变绿…':state==='go'?'现在点！':state==='end'?'已完成':'开始下一次','tap','mini-big',state==='end','background:'+(state==='go'?'#2b8d68':'#394664')),tap)}
  function tap(){if(state==='wait'){state='ready';draw('抢点了，这次不计');return}if(state==='go'){results.push(Math.round(performance.now()-stamp));const last=results.at(-1);state=results.length===5?'end':'ready';draw(state==='end'?'平均 '+Math.round(results.reduce((a,b)=>a+b,0)/5)+' 毫秒':'这次 '+last+' 毫秒，已测 '+results.length+' / 5');return}if(state!=='ready')return;state='wait';const run=++token;draw('等绿色再点');u.delay(()=>{if(state==='wait'&&run===token){state='go';stamp=performance.now();draw('现在点！')}},900+mrand(2200))}
  let token=0;draw('点击开始')
});
function flipLights(b,i){for(const p of [i,...madj(i,5)])b[p]=!b[p]}
miniRegister('lights','关灯挑战','💡','点一盏灯，它和上下左右会一起切换。把所有灯关掉。',u=>{
  const b=Array(25).fill(false);for(let i=0;i<11;i++)flipLights(b,mrand(25));if(!b.some(Boolean))flipLights(b,12);let moves=0;
  function draw(){const won=!b.some(Boolean);u.show(won?'全部关掉！用了 '+moves+' 步':'步数 '+moves,mgrid(5,b.map((v,i)=>mbutton(v?'亮':'暗',i,'mcell'+(v?' lamp':''),won))),k=>{flipLights(b,+k);moves++;draw()})}draw()
});
miniRegister('peg','跳棋独行','⚪','白圆是棋子，小点是空位。先点一颗白棋，再点高亮空位：横着或竖着跳过紧挨的一颗棋，被跳过的棋就消失。',u=>{
  const original=()=>Array.from({length:49},(_,i)=>i===24?0:(i%7>=2&&i%7<=4)||(Math.floor(i/7)>=2&&Math.floor(i/7)<=4)?1:-1);
  let b=original(),picked=-1,steps=0,lesson=false,history=[];
  const legal=(a,c)=>a>=0&&b[a]===1&&b[c]===0&&((Math.floor(a/7)===Math.floor(c/7)&&Math.abs(a-c)===2)||(a%7===c%7&&Math.abs(a-c)===14))&&b[(a+c)/2]===1;
  const allowed=()=>b.flatMap((v,i)=>v===1&&b.some((_,j)=>legal(i,j))?[i]:[]);
  function draw(msg){let left=b.filter(v=>v===1).length,done=!allowed().length;u.show(msg||(left===1?'成功，只剩一颗！':done?'没有可跳的棋子，剩 '+left+' 颗':picked<0?'剩 '+left+' 颗。先点一颗能跳的白棋。':'点高亮的落点。'),mgrid(7,b.map((v,i)=>mbutton(v===1?'●':v===0?'·':'',i,'mcell'+(i===picked||legal(picked,i)||(lesson&&i===10&&!steps&&picked<0)?' picked':''),v===-1||done)))+mbutton('教我第一步','teach','action secondary')+mbutton('撤销','undo','action secondary',!history.length),tap)}
  function tap(k){if(k==='teach'){b=original();picked=-1;steps=0;history=[];lesson=true;draw('先点中间空位正上方隔两格、亮起的那颗白棋。');return}if(k==='undo'){if(!history.length)return;b=history.pop();steps--;picked=-1;draw();return}const j=+k;if(lesson&&!steps&&picked<0&&j!==10)return draw('先点亮起的白棋。');if(b[j]===1){if(!allowed().includes(j))return draw('这颗白棋旁边没有可跳过的棋和空位。换一颗。');picked=j;draw(lesson&&!steps?'再点棋盘正中央亮起的空位。':'');return}if(legal(picked,j)){history.push(b.slice());b[j]=1;b[picked]=b[(picked+j)/2]=0;picked=-1;steps++;const teaching=lesson;lesson=false;draw(teaching?'跳成功了！中间被跳过的棋消失了。试试下一步。':'')}else draw('要先点白棋，再点它能跳到的空位。')}draw()
});
function gomokuAI(b,n,mode){
  const empty=b.flatMap((v,i)=>v?[]:[i]),wins=(i,v)=>{b[i]=v;const ok=mline(b,i,n,5);b[i]=0;return ok};
  const win=empty.find(i=>wins(i,2));if(win!==undefined)return win;
  if(mode!=='easy'||Math.random()<.45){const block=empty.find(i=>wins(i,1));if(block!==undefined)return block}
  const score=(i,v)=>{let x=i%n,y=Math.floor(i/n),total=0;for(const [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){let len=1,open=0;for(const sign of [-1,1]){let a=x+dx*sign,c=y+dy*sign;while(a>=0&&a<n&&c>=0&&c<n&&b[c*n+a]===v){len++;a+=dx*sign;c+=dy*sign}if(a>=0&&a<n&&c>=0&&c<n&&!b[c*n+a])open++}if(open)total+=(open===2?3:1)*Math.pow(7,len-1)}return total};
  return empty.map(i=>[i,score(i,2)+(mode==='hard'?1.3:mode==='normal'?.9:.4)*score(i,1)+(mode==='easy'?Math.random()*45:0)-.01*Math.hypot(i%n-5,Math.floor(i/n)-5)]).sort((a,b)=>b[1]-a[1])[0]?.[0];
}
miniRegister('gomoku','五子棋','⚫','可同屏双人，也可和电脑下。横、竖、斜线连成五枚就赢。',u=>{
  let b=Array(121).fill(0),turn=1,done='',mode='two',serial=0,busy=false;
  const options=[['two','双人'],['easy','人机入门'],['normal','人机普通'],['hard','人机挑战']];
  function draw(){u.show(done||(busy?'电脑正在想下一步':(turn===1?'黑棋':'白棋')+'落子'),mgrid(11,b.map((v,i)=>mbutton(['·','●','○'][v],i,'mcell small',!!(done||v||busy))))+options.map(([id,label])=>mbutton(label,'mode'+id,'action '+(id===mode?'':'secondary'))).join(''),tap)}
  function place(i){if(i==null||b[i]!==0)return;b[i]=turn;if(mline(b,i,11,5))done=(turn===1?'黑棋':'白棋')+'获胜！';else if(b.every(Boolean))done='平局';else turn=3-turn}
  function tap(k){if(k.startsWith('mode')){mode=k.slice(4);b=Array(121).fill(0);turn=1;done='';busy=false;serial++;draw();return}if(done||busy||b[+k]!==0)return;place(+k);if(!done&&mode!=='two'&&turn===2){busy=true;const stamp=serial;u.delay(()=>{if(stamp!==serial)return;place(gomokuAI(b,11,mode));busy=false;draw()},280)}draw()}draw()
});
miniRegister('nim','取石子','🪨','一回合只能从一堆拿。谁拿到最后一颗谁赢。入门电脑会漏招，挑战电脑会计算最优走法。',u=>{
  let b,row,busy,done,mode='easy',serial=0;
  const modes=[['easy','入门'],['normal','普通'],['hard','挑战']];
  function reset(){b=mode==='easy'?[1,2,3]:mode==='normal'?[3,4,5]:[3,5,7,8];row=0;busy=false;done='';serial++;draw()}
  function draw(msg){u.show(done||msg||'先选一堆，再选取走几颗',b.map((n,i)=>mbutton('第 '+(i+1)+' 堆：'+n+' 颗','row'+i,'action '+(row===i?'':'secondary'),busy||!n||!!done)).join('')+'<div>'+Array.from({length:b[row]},(_,i)=>mbutton('取 '+(i+1),i+1,'action secondary',busy||!!done)).join('')+'</div>'+modes.map(([d,l])=>mbutton(l,'mode'+d,'action '+(d===mode?'':'secondary'))).join(''),tap)}
  function tap(k){if(k.startsWith('mode')){mode=k.slice(4);reset();return}if(busy||done)return;if(k.startsWith('row')){row=+k.slice(3);draw();return}const n=+k;if(!Number.isInteger(n)||n<1||n>b[row])return;b[row]-=n;if(!b.some(Boolean)){done='你拿到最后一颗，获胜！';draw();return}busy=true;draw('电脑正在选');const stamp=serial;u.delay(()=>{if(stamp!==serial)return;const xor=b.reduce((a,v)=>a^v,0);let i=b.findIndex(v=>(v^xor)<v),take=i>=0?b[i]-(b[i]^xor):1;if(i<0||mode==='easy'||(mode==='normal'&&Math.random()<.35)){const available=b.flatMap((v,j)=>v?[j]:[]);i=available[mrand(available.length)];take=1+mrand(b[i])}b[i]-=take;if(!b.some(Boolean))done='电脑拿到最后一颗';busy=false;if(!b[row])row=Math.max(0,b.findIndex(Boolean));draw('电脑从第 '+(i+1)+' 堆取了 '+take+' 颗')},350)}reset()
});
miniRegister('queens','八皇后','♛','摆下八个皇后，让任意两个都不在同一行、列或斜线。再点可移除。',u=>{

function sudokuValid(b){const ok=a=>new Set(a.filter(Boolean)).size===a.filter(Boolean).length;for(let i=0;i<9;i++){if(!ok(b.slice(i*9,i*9+9))||!ok(Array.from({length:9},(_,j)=>b[j*9+i])))return false;const r=Math.floor(i/3)*3,c=i%3*3;if(!ok(Array.from({length:9},(_,j)=>b[(r+Math.floor(j/3))*9+c+j%3])))return false}return true}

miniRegister('sudoku','九宫格数独','▦','每行、每列、每个粗框内都要填 1 到 9，数字不能重复。先选难度，再点格子和数字。',u=>{
  const options=[['easy','入门'],['normal','普通'],['hard','挑战']];
  let fixed,b,at,mode='easy',last=-1;
  function reset(d){mode=d;const packs=SUDOKU_PACKS[d];last=(last+1+mrand(packs.length-1))%packs.length;const perm=shuffle([1,2,3,4,5,6,7,8,9]);fixed=[...packs[last]].map(v=>+v?perm[+v-1]:0);b=fixed.slice();at=-1;draw()}
  function draw(){const valid=sudokuValid(b),won=valid&&b.every(Boolean);u.show(won?'数独完成！':valid?'选一个空格填数字（已给 '+fixed.filter(Boolean).length+' 格）':'出现重复数字，检查行、列和粗框',mgrid(9,b.map((v,i)=>mbutton(v||'·','c'+i,'mcell small'+(fixed[i]?' shade':'')+(i===at?' picked':''),won||!!fixed[i],((i%9===2||i%9===5)?'border-right:2px solid #90a7c8;':'')+((Math.floor(i/9)===2||Math.floor(i/9)===5)?'border-bottom:2px solid #90a7c8':' '))))+'<div class="mini-palette">'+Array.from({length:10},(_,i)=>mbutton(i||'清除','n'+i,'action secondary',at<0||won)).join('')+'</div>'+options.map(([d,l])=>mbutton(l,'mode'+d,'action '+(d===mode?'':'secondary'))).join('')+mbutton('换一题','new','action secondary'),tap)}

function flips8(b,i,p){if(b[i])return [];let out=[];for(let [dx,dy] of eightDirs){let x=i%8+dx,y=Math.floor(i/8)+dy,a=[];while(x>=0&&x<8&&y>=0&&y<8&&b[y*8+x]===3-p){a.push(y*8+x);x+=dx;y+=dy}if(x>=0&&x<8&&y>=0&&y<8&&b[y*8+x]===p)out.push(...a)}return out}

  });

function resizeGame(){
  const canvas=document.querySelector('#game-canvas');
  if(!canvas)return;
  const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.max(1,Math.round(r.width*dpr));
  canvas.height=Math.max(1,Math.round(r.width*1.25*dpr));
  g.ctx=canvas.getContext('2d');
  g.ctx.setTransform(canvas.width/480,0,0,canvas.height/600,0,0);

}

    if(b)b.textContent='模式：翻开'
  }else if(id==='four'){
    g.board=Array.from({
      length:6
    },()=>Array(7).fill(0));

    g.note='你先下，点击一列。'
  }else if(id==='flap'){
    g.birdY=280;
    g.vy=0;
    g.pipes=[newPipe(530,300)];
    g.spawn=0
  }else if(id==='whack'){
    g.remaining=HALL_SETTINGS.whackSeconds;
    g.target=null;
    g.spawn=.5;
    g.hits=0;
    g.missed=0
  }else if(id==='soko'){
    loadSoko(level)
  }else if(id==='slide'){
    g.size=size;
    g.tiles=shuffleSlide(size);
    g.moves=0
  }let overlay=document.querySelector('#g-overlay');
  overlay.hidden=true;
  if(!started)showGameOverlay(GAME_INFO[id].name,'准备好后开始，支持触屏和键盘。','开始游戏','resetGame(true)');
  updateGameHud();
  drawGame();

  });

}
function showGameOverlay(title,body,label,handler){

  e.hidden=false;
  e.innerHTML='<h3>'+title+'</h3><p>'+body+'</p><button onclick="'+handler+'">'+label+'</button>'
}
function finishGame(title,note){

  g.note=note||title;
  saveGameBest();
  showGameOverlay(title,note||('得分 '+g.score),'再玩一次','resetGame(true)');

function pauseGame(){
  if(!g.running||!g.started||g.ended)return;
  if(g.paused){
    g.paused=false;
    g.last=0;
    document.querySelector('#g-overlay').hidden=true;
    document.querySelector('#game-canvas').focus({
      preventScroll:true
    })
  }else{
    g.paused=true;
    heldKeys={
    };
    lastPointer=null;
    showGameOverlay('已暂停','计时与画面都暂停了。','继续','pauseGame()')
  }
}
function updateGameHud(){
  let a=g.score+' 分',b='本机最高 '+Math.max(g.best,g.score)+' 分';
  if(g.id==='snake')b='长度 '+g.body.length;
  if(g.id==='tetris')b='消除 '+g.lines+' 行 · 等级 '+(1+Math.floor(g.lines/10));
  if(g.id==='bricks')b='第 '+g.level+' / 3 关 · 剩余 '+g.lives+' 条命';
  if(g.id==='mines'){
    a='旗子 '+g.flags.filter(Boolean).length+' / 10';
    b='用时 '+Math.floor(g.time)+' 秒'
  }if(g.id==='four'){
    a=g.turn===1?'你：橙色':'电脑：青色';
    b='四枚连线获胜'
  }if(g.id==='soko'){
    a='第 '+(g.level+1)+' / '+SOKO_LEVELS.length+' 关';
    b='步数 '+g.moves
  }if(g.id==='slide'){
    a='步数 '+g.moves;
    b='用时 '+Math.floor(g.time)+' 秒'
  }if(g.id==='whack')b='剩余 '+Math.ceil(g.remaining)+' 秒';
  document.querySelector('#g-score').textContent=a;
  document.querySelector('#g-extra').textContent=b;
  document.querySelector('#g-note').textContent=g.note||(['merge','soko','slide'].includes(g.id)?'可以滑动屏幕，也可以使用下方方向键。':'')
}
function gameLoop(now){
  if(!g.running)return;
  let dt=g.last?Math.min(.06,(now-g.last)/1000):0;
  g.last=now;
  if(g.started&&!g.paused&&!g.ended){
    if(g.id!=='mines'||g.placed)g.time+=dt;
    let rest=dt;
    while(rest>0&&!g.ended){
      let step=Math.min(.008,rest);
      if(g.id==='snake')snakeStep(step);
      if(g.id==='tetris')tetrisStep(step);
      if(g.id==='bricks')bricksStep(step);
      if(g.id==='flap')flapStep(step);
      if(g.id==='whack')whackStep(step);
      if(g.id==='four')fourStep(step);
      rest-=step
    }drawGame();
    updateGameHud()
  }gameFrame=requestAnimationFrame(gameLoop)
}
function gamePoint(e){
  const r=document.querySelector('#game-canvas').getBoundingClientRect();
  return{
    x:(e.clientX-r.left)*480/r.width,y:(e.clientY-r.top)*600/r.height
  }
}
function gamePointerDown(e){
  if(e.button!==undefined&&e.button!==0)return;
  if(!g.started||g.ended||g.paused)return;
  e.preventDefault();
  e.currentTarget.focus({
    preventScroll:true
  });
  e.currentTarget.setPointerCapture(e.pointerId);
  if(lastPointer)return;
  const p=gamePoint(e);
  lastPointer={
    ...p,id:e.pointerId
  };
  if(g.id==='flap')gameAction('flap');
  if(g.id==='bricks'){
    g.paddle=Math.max(45,Math.min(435,p.x));
    gameAction('fire')
  }if(['mines','four','whack','slide'].includes(g.id))gameTap(p)
}
function gamePointerMove(e){
  if(g.id==='bricks'&&!g.paused&&!g.ended&&g.started){
    const p=gamePoint(e);
    g.paddle=Math.max(45,Math.min(435,p.x))
  }
}
function gamePointerUp(e){
  if(!lastPointer||lastPointer.id!==e.pointerId)return;
  const p=gamePoint(e),old=lastPointer;
  lastPointer=null;
  if(!['merge','snake','tetris','soko','slide'].includes(g.id)||g.paused||g.ended)return;
  let dx=p.x-old.x,dy=p.y-old.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<16){
    if(g.id==='tetris')gameAction('up');
    return
  }gameAction(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))
}
function gameKeyDown(e){
  const action={
    ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Space:g.id==='tetris'?'drop':g.id==='flap'?'flap':'fire'
  }[e.code];
  if(!action)return;
  e.preventDefault();
  heldKeys[e.code]=true;
  if(g.id==='bricks'&&(action==='left'||action==='right'))return;
  if(!e.repeat||g.id==='tetris')gameAction(action)
}
function gameAction(action){
  if(!g.running||!g.started||g.paused||g.ended)return;
  if(g.id==='merge'&&DIRS[action])move2048(action);
  if(g.id==='snake'&&DIRS[action]&&!g.turnQueued){
    let a=DIRS[action],b=DIRS[g.dir];
    if(a[0]!==-b[0]||a[1]!==-b[1]){
      g.nextDir=action;
      g.turnQueued=true
    }
  }if(g.id==='tetris')tetrisAction(action);
  if(g.id==='bricks'){
    if(action==='left')g.paddle=Math.max(45,g.paddle-28);
    if(action==='right')g.paddle=Math.min(435,g.paddle+28);
    if(action==='fire'&&g.waiting){
      g.waiting=false;
      g.ball.vx=150;
      g.ball.vy=-285
    }
  }if(g.id==='flap'&&action==='flap')g.vy=-330;
  if(g.id==='soko'&&DIRS[action])sokoMove(action);
  if(g.id==='slide'&&DIRS[action])slideDirection(action);
  drawGame();
  updateGameHud();
  document.querySelector('#game-canvas').focus({
    preventScroll:true
  })
}
function gameTap(p){
  if(g.id==='mines')mineTap(p.x,p.y,g.mark);
  if(g.id==='four'){
    let col=Math.floor((p.x-30)/60);
    if(p.y>=100&&p.y<=480&&col>=0&&col<7)humanFour(col)
  }if(g.id==='whack')whackTap(p.x,p.y);
  if(g.id==='slide'){
    let cell=400/g.size,x=Math.floor((p.x-40)/cell),y=Math.floor((p.y-80)/cell);
    if(x>=0&&x<g.size&&y>=0&&y<g.size)slideMove(y*g.size+x)
  }drawGame();
  updateGameHud()
}
function pushHistory(data){
  g.history.push(data);
  if(g.history.length>100)g.history.shift()
}
function gameUndo(){
  if(!g.history.length){
    g.note='还没有可以撤销的一步。';
    updateGameHud();
    return
  }let h=g.history.pop();
  if(g.id==='merge'){
    g.board=h.board;
    g.score=h.score
  }if(g.id==='soko'){
    g.player=h.player;
    g.boxes=h.boxes;
    g.moves=h.moves
  }if(g.id==='slide'){
    g.tiles=h.tiles;
    g.moves=h.moves
  }g.ended=false;
  g.note='已撤销一步。';
  document.querySelector('#g-overlay').hidden=true;
  drawGame();
  updateGameHud()
}
// 2048: merge each tile at most once in a move.
function mergeLine(line){
  let nums=line.filter(Boolean),out=[],points=0;
  for(let i=0;i<nums.length;i++){
    if(nums[i]===nums[i+1]){
      let value=nums[i]*2;
      out.push(value);
      points+=value;
      i++
    }else out.push(nums[i])
  }while(out.length<line.length)out.push(0);
  return{
    line:out,points
  }
}
function add2048(){
  let empty=g.board.map((v,i)=>v? -1:i).filter(i=>i>=0);
  if(empty.length)g.board[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.9?2:4
}
function can2048(board){

const TETROMINOES=[[[1,1,1,1]],[[2,0,0],[2,2,2]],[[0,0,3],[3,3,3]],[[4,4],[4,4]],[[0,5,5],[5,5,0]],[[0,6,0],[6,6,6]],[[7,7,0],[0,7,7]]];
const TILE_COLORS=['#263650','#62cedc','#7984ed','#efa853','#edce5a','#76d1ab','#b38aee','#eb7d9a'];
function takeTetromino(){
  if(!g.bag.length)g.bag=shuffle([0,1,2,3,4,5,6]);
  return TETROMINOES[g.bag.pop()].map(r=>r.slice())
}
function tetFits(shape,x,y){
  return shape.every((row,dy)=>row.every((v,dx)=>!v||(x+dx>=0&&x+dx<10&&y+dy<20&&(y+dy<0||!g.board[y+dy][x+dx]))))
}
function spawnTetromino(){
  g.piece=g.next;
  g.next=takeTetromino();
  g.px=Math.floor((10-g.piece[0].length)/2);
  g.py=0;
  g.acc=0;
  if(!tetFits(g.piece,g.px,g.py))finishGame('堆到顶了','得分 '+g.score+' · 消除 '+g.lines+' 行')
}
function lockTetromino(){
  for(let y=0;y<g.piece.length;y++)for(let x=0;x<g.piece[y].length;x++)if(g.piece[y][x]){
    if(g.py+y<0){
      finishGame('堆到顶了');
      return
    }g.board[g.py+y][g.px+x]=g.piece[y][x]
  }let remain=g.board.filter(r=>r.some(v=>!v)),cleared=20-remain.length;
  while(remain.length<20)remain.unshift(Array(10).fill(0));
  g.board=remain;
  if(cleared){
    g.score+=[0,100,300,500,800][cleared]*(1+Math.floor(g.lines/10));
    g.lines+=cleared;
    g.note='消除 '+cleared+' 行！';
    saveGameBest()
  }spawnTetromino()
}
function tetrisAction(action){
  if(action==='left'||action==='right'){
    let x=g.px+(action==='left'?-1:1);
    if(tetFits(g.piece,x,g.py))g.px=x
  }if(action==='up'){
    let rot=g.piece[0].map((_,x)=>g.piece.map(row=>row[x]).reverse());
    for(let kick of [0,-1,1,-2,2])if(tetFits(rot,g.px+kick,g.py)){
      g.piece=rot;
      g.px+=kick;
      break
    }
  }if(action==='down'){
    if(tetFits(g.piece,g.px,g.py+1)){
      g.py++;
      g.score++
    }else lockTetromino()
  }if(action==='drop'){
    while(tetFits(g.piece,g.px,g.py+1)){
      g.py++;
      g.score+=2
    }lockTetromino()
  }
}
function tetrisStep(dt){
  g.acc+=dt;
  if(g.acc>=Math.max(.12,.65-Math.floor(g.lines/10)*.07)){
    g.acc=0;
    if(tetFits(g.piece,g.px,g.py+1))g.py++;

  }
}

function mineNeighbors(i){

}
function placeMines(first){

  for(let i of slots)g.board[i]=-1;
  for(let i=0;i<81;i++)if(g.board[i]!==-1)g.board[i]=mineNeighbors(i).filter(n=>g.board[n]===-1).length;

function mineTap(x,y,flag=false){
  if(g.ended||g.paused)return;
  let col=Math.floor((x-42)/44),row=Math.floor((y-75)/44);

  let i=row*9+col;

    if(!g.revealed[i]){
      if(g.flags[i]||g.flags.filter(Boolean).length<10)g.flags[i]=!g.flags[i];
      else g.note='最多标记 10 面旗子。'
    }return
  }if(g.flags[i])return;
  if(!g.placed)placeMines(i);
  let queue=[i];
  if(g.revealed[i]){
    if(g.board[i]<=0)return;
    let ns=mineNeighbors(i);
    if(ns.filter(n=>g.flags[n]).length!==g.board[i])return;
    queue=ns.filter(n=>!g.flags[n]&&!g.revealed[n])
  }while(queue.length){
    let at=queue.pop();

    if(g.board[at]===-1){
      finishGame('踩到雷了','插旗可以帮助你记录判断。');
      return
    }if(g.board[at]===0)queue.push(...mineNeighbors(at).filter(n=>!g.revealed[n]))
  }if(g.revealed.filter(Boolean).length===71){

// Four in a row, with a depth-four opponent.
function dropFour(board,col,player){
  for(let row=5;row>=0;row--)if(!board[row][col]){
    board[row][col]=player;
    return row
  }return -1
}
function fourWinner(board){
  for(let y=0;y<6;y++)for(let x=0;x<7;x++)if(board[y][x])for(let [dx,dy]of [[1,0],[0,1],[1,1],[1,-1]]){
    let ex=x+3*dx,ey=y+3*dy;
    if(ex>=0&&ex<7&&ey>=0&&ey<6&&[1,2,3].every(n=>board[y+n*dy][x+n*dx]===board[y][x]))return board[y][x]
  }return 0
}
function fourEval(board){
  let value=0;
  for(let row of board)value+=(row[3]===2?5:row[3]===1?-5:0);
  for(let y=0;y<6;y++)for(let x=0;x<7;x++)for(let [dx,dy]of [[1,0],[0,1],[1,1],[1,-1]]){
    let ex=x+3*dx,ey=y+3*dy;
    if(ex<0||ex>=7||ey<0||ey>=6)continue;
    let ns=[0,1,2,3].map(n=>board[y+n*dy][x+n*dx]),p=ns.filter(v=>v===1).length,c=ns.filter(v=>v===2).length;
    if(!p)value+=[0,1,8,70,10000][c];
    if(!c)value-=[0,1,10,95,10000][p]
  }return value
}
function fourSearch(board,depth,maximizing,alpha=-Infinity,beta=Infinity){
  let winner=fourWinner(board);
  if(winner)return winner===2?100000+depth:-100000-depth;
  let cols=[3,2,4,1,5,0,6].filter(c=>!board[0][c]);
  if(!cols.length)return 0;
  if(!depth)return fourEval(board);
  let best=maximizing?-Infinity:Infinity;
  for(let col of cols){
    let row=dropFour(board,col,maximizing?2:1),value=fourSearch(board,depth-1,!maximizing,alpha,beta);
    board[row][col]=0;
    if(maximizing){
      best=Math.max(best,value);
      alpha=Math.max(alpha,best)
    }else{
      best=Math.min(best,value);
      beta=Math.min(beta,best)
    }if(beta<=alpha)break
  }return best
}
function bestFourMove(board,difficulty='normal'){
  const legal=[3,2,4,1,5,0,6].filter(c=>!board[0][c]);
  if(!legal.length)return -1;
  if(difficulty==='easy'){
    for(const c of legal){const r=dropFour(board,c,2),win=fourWinner(board)===2;board[r][c]=0;if(win)return c}
    if(Math.random()<.65)return legal[Math.floor(Math.random()*legal.length)];
  }
  const depth=difficulty==='hard'?5:difficulty==='easy'?1:3;
  let best=-Infinity,choice=3;
  for(let col of [3,2,4,1,5,0,6])if(!board[0][col]){
    let row=dropFour(board,col,2),value=fourSearch(board,depth,false,best,Infinity);
    board[row][col]=0;
    if(value>best){
      best=value;
      choice=col
    }
  }return choice
}
function checkFourEnd(){
  let winner=fourWinner(g.board);
  if(winner){
    g.score=winner===1?1:0;
    finishGame(winner===1?'你赢了！':'电脑连成四子了',winner===1?'四枚连线完成。':'再来一盘，试试先挡住对方的三连。');
    return true
  }if(g.board[0].every(Boolean)){
    finishGame('平局','棋盘填满，双方都没有四连。');
    return true
  }return false
}

// Sliding puzzle: shuffle through legal moves so every board is solvable.
function slideAdjacent(i,j,size){
  return Math.abs(i%size-j%size)+Math.abs(Math.floor(i/size)-Math.floor(j/size))===1
}
function slideSolved(tiles){
  return tiles.every((v,i)=>v===(i+1)%tiles.length)
}
function shuffleSlide(size){
  let tiles=Array.from({
    length:size*size
  },(_,i)=>(i+1)%(size*size)),blank=tiles.length-1,previous=-1;
  for(let t=0;t<Math.max(220,size*size*18);t++){
    let choices=tiles.map((_,i)=>i).filter(i=>i!==previous&&slideAdjacent(i,blank,size)),at=choices[Math.floor(Math.random()*choices.length)];
    [tiles[at],tiles[blank]]=[tiles[blank],tiles[at]];
    previous=blank;
    blank=at
  }if(slideSolved(tiles)){
    let at=blank===0?1:blank-1;
    [tiles[at],tiles[blank]]=[tiles[blank],tiles[at]]
  }return tiles
}
function slideMove(at){
  let blank=g.tiles.indexOf(0);
  if(!slideAdjacent(at,blank,g.size))return;
  pushHistory({
    tiles:g.tiles.slice(),moves:g.moves
  });
  [g.tiles[at],g.tiles[blank]]=[g.tiles[blank],g.tiles[at]];
  g.moves++;
  if(slideSolved(g.tiles)){
    g.score=1;
    finishGame('排列完成！',g.moves+' 步 · '+Math.floor(g.time)+' 秒')
  }
}
function slideDirection(dir){
  let blank=g.tiles.indexOf(0),d=DIRS[dir],x=blank%g.size+d[0],y=Math.floor(blank/g.size)+d[1];
  if(x>=0&&x<g.size&&y>=0&&y<g.size)slideMove(y*g.size+x)
}

  if(g.id==='snake')drawSnake(c);
  if(g.id==='tetris')drawTetris(c);
  if(g.id==='bricks')drawBricks(c);
  if(g.id==='mines')drawMines(c);
  if(g.id==='four')drawFour(c);
  if(g.id==='flap')drawFlap(c);
  if(g.id==='whack')drawWhack(c);
  if(g.id==='soko')drawSoko(c);
  if(g.id==='slide')drawSlide(c)
}
function draw2048(c){
  if(!g.board)return;
  text(c,'合并相同数字',240,36,22);
  rect(c,24,75,432,432,'#293a55',14);
  let colors={
    2:'#dce7ef',4:'#b9d7e3',8:'#64c6ce',16:'#3ba9bd',32:'#4186c3',64:'#6979d9',128:'#9c76d7',256:'#c273c3',512:'#d97da1',1024:'#e5a352',2048:'#eac65b'
  };
  for(let i=0;i<16;i++){
    let v=g.board[i],x=32+i%4*106,y=83+Math.floor(i/4)*106;
    rect(c,x,y,98,98,v?(colors[v]||'#c9abef'):'#1d2c45',10);
    if(v)text(c,v,x+49,y+49,v>999?29:36,v<8?'#263a52':'#fff')
  }text(c,'↑ ↓ ← →   或滑动棋盘',240,552,18,'#aebfda')
}
function drawSnake(c){
  if(!g.body)return;
  text(c,'吃食物，别撞墙',240,35,21);
  rect(c,18,68,444,444,'#0f192b',7);
  for(let y=0;y<20;y++)for(let x=0;x<20;x++)if((x+y)%2===0)c.fillStyle='#17243b',c.fillRect(20+x*22,70+y*22,22,22);
  if(g.food){
    dot(c,31+g.food.x*22,81+g.food.y*22,8,'#f3a363');
    dot(c,34+g.food.x*22,76+g.food.y*22,2,'#fff0d8')
  }for(let i=g.body.length-1;i>=0;i--){
    let p=g.body[i];
    rect(c,21+p.x*22,71+p.y*22,20,20,i===0?'#c7f1c0':'#60c5a7',6)
  }let head=g.body[0],d=DIRS[g.dir],hx=31+head.x*22,hy=81+head.y*22;
  dot(c,hx+d[0]*5-d[1]*4,hy+d[1]*5+d[0]*4,2,'#14213a');
  dot(c,hx+d[0]*5+d[1]*4,hy+d[1]*5-d[0]*4,2,'#14213a');
  text(c,'滑动 / 方向键 / 下方按钮',240,552,18,'#aebfda')
}
function tetCell(c,x,y,v,alpha=1){
  c.globalAlpha=alpha;
  rect(c,70+x*26+1,40+y*26+1,24,24,TILE_COLORS[v],3);
  c.globalAlpha=1
}
function drawTetris(c){
  if(!g.board)return;
  rect(c,68,38,264,524,'#0d172b',5);
  for(let y=0;y<20;y++)for(let x=0;x<10;x++){
    if(g.board[y][x])tetCell(c,x,y,g.board[y][x]);
    else{
      c.strokeStyle='#22314a';
      c.strokeRect(70+x*26,40+y*26,26,26)
    }
  }if(g.piece){
    let ghost=g.py;
    while(tetFits(g.piece,g.px,ghost+1))ghost++;
    for(let y=0;y<g.piece.length;y++)for(let x=0;x<g.piece[y].length;x++)if(g.piece[y][x]){
      tetCell(c,g.px+x,ghost+y,g.piece[y][x],.22);
      tetCell(c,g.px+x,g.py+y,g.piece[y][x])
    }
  }text(c,'下一个',395,65,18,'#bfcde4');
  if(g.next)g.next.forEach((row,y)=>row.forEach((v,x)=>{
    if(v)rect(c,351+x*22,100+y*22,20,20,TILE_COLORS[v],3)
  }));
  text(c,'↑ 旋转',398,250,15);
  text(c,'↓ 下降',398,285,15);
  text(c,'空格',398,340,17);
  text(c,'直接落底',398,369,14);
  text(c,'左右滑动 · 轻点旋转',240,582,16,'#aebfda')
}
function drawBricks(c){
  if(!g.bricks)return;
  rect(c,5,32,470,565,'#101b30',10);
  for(let b of g.bricks)if(b.hp>0){
    rect(c,b.x,b.y,b.w,b.h,b.hp===2?'#d184db':['#63c7cf','#7c9ae4','#c9b465','#e49d75','#a7d39c'][Math.floor((b.y-85)/27)],4);
    if(b.hp===2)text(c,'Ⅱ',b.x+b.w/2,b.y+10,12,'#fff')
  }rect(c,g.paddle-43,548,86,12,'#b5a8f5',6);
  dot(c,g.ball.x,g.ball.y,7,'#fff3ba');
  if(g.waiting)text(c,'点击 / 空格发球',240,460,22,'#d6dff5')
}
function drawMines(c){
  if(!g.board)return;
  text(c,g.mark?'插旗模式 🚩':'翻开模式',240,35,20,g.mark?'#f5cc7a':'#b4dfe1');
  const colors=['','#719ee9','#6cd1b5','#ef9b7c','#c490e8','#edd285','#7acee0','#c8cfe1','#e2b6d1'];
  for(let i=0;i<81;i++){
    let x=42+i%9*44,y=75+Math.floor(i/9)*44,show=g.revealed[i]||(g.ended&&g.board[i]===-1);
    rect(c,x+2,y+2,40,40,show?'#26364e':'#53618a',5);
    if(show&&g.board[i]===-1)text(c,'💣',x+22,y+23,25);
    else if(g.flags[i])text(c,'🚩',x+22,y+23,24);
    else if(show&&g.board[i]>0)text(c,g.board[i],x+22,y+23,23,colors[g.board[i]])
  }text(c,'数字 = 周围八格的雷数',240,520,18,'#aebfda');
  text(c,'电脑右键插旗 · 触屏用模式按钮',240,555,16,'#aebfda')
}
function drawFour(c){
  if(!g.board)return;
  text(c,g.turn===1?'轮到你了':'电脑思考中',240,45,23,g.turn===1?'#f1b768':'#7ad1d0');
  rect(c,24,100,432,382,'#344e7c',14);
  for(let y=0;y<6;y++)for(let x=0;x<7;x++){
    let v=g.board[y][x];
    dot(c,60+x*60,145+y*55,22,v===1?'#efac61':v===2?'#67d0c9':'#14233d');
    if(v)dot(c,54+x*60,138+y*55,6,v===1?'#ffd5a2':'#a8f4e4')
  }text(c,'点击一列落子',240,535,20,'#c4d2e8')
}
function drawFlap(c){
  if(!g.pipes)return;
  bg(c,'#c1e6ed');
  for(let x=0;x<480;x+=110){
    rect(c,x+15,70,70,10,'#e7f7fa',5);
    rect(c,x+40,59,30,12,'#e7f7fa',6)
  }let gap=Math.max(145,HALL_SETTINGS.flapGap-g.score*2);
  for(let p of g.pipes){
    let top=p.center-gap/2,bottom=p.center+gap/2;
    rect(c,p.x,30,65,top-30,'#438f94',3);
    rect(c,p.x-4,top-16,73,16,'#68b6ae',4);
    rect(c,p.x,bottom,65,560-bottom,'#438f94',3);
    rect(c,p.x-4,bottom,73,16,'#68b6ae',4)
  }c.fillStyle='#80b5a7';
  c.fillRect(0,560,480,40);
  c.fillStyle='#f0e4b8';
  c.fillRect(0,571,480,29);
  c.save();
  c.translate(100,g.birdY);
  c.rotate(Math.max(-.45,Math.min(.8,g.vy/650)));
  text(c,'🐤',0,0,36,'#fff');
  c.restore();
  text(c,g.score,240,65,34,'#29596a')
}
function drawWhack(c){
  bg(c,'#253c44');
  text(c,'只点地鼠，避开炸弹',240,40,21,'#dcf1da');
  for(let i=0;i<9;i++){
    let x=100+i%3*140,y=160+Math.floor(i/3)*150;
    rect(c,x-58,y-55,116,115,'#335354',18);
    c.fillStyle='#182d35';
    c.beginPath();
    c.ellipse(x,y+22,49,23,0,0,Math.PI*2);
    c.fill();
    if(g.target&&g.target.index===i){
      text(c,g.target.bomb?'💣':'🐹',x,y-2,76);
      rect(c,x-42,y+47,84,5,'#1b3037',2);
      rect(c,x-42,y+47,84*Math.min(1,g.target.life/.95),5,'#efcd72',2)
    }
  }
}
function drawSoko(c){
  if(!g.map)return;
  const scale=Math.min(1,440/(50*g.width),415/(50*g.height));
  c.save();c.translate(240,100);c.scale(scale,scale);c.translate(-240,-100);
  let cell=50,ox=(480-g.width*cell)/2,oy=100;
  for(let y=0;y<g.height;y++)for(let x=0;x<g.width;x++){
    let at=y*g.width+x,px=ox+x*cell,py=oy+y*cell;
    rect(c,px+1,py+1,48,48,g.walls.includes(at)?'#5c6d8e':'#21334d',4);
    if(g.goals.includes(at))dot(c,px+25,py+25,10,'#6fd4b1');
    if(g.boxes.includes(at)){
      rect(c,px+5,py+5,40,40,g.goals.includes(at)?'#64b89e':'#ddb273',6);
      c.strokeStyle='#5f604e';
      c.lineWidth=2;
      c.strokeRect(px+11,py+11,28,28);
      c.beginPath();
      c.moveTo(px+11,py+11);
      c.lineTo(px+39,py+39);
      c.moveTo(px+39,py+11);
      c.lineTo(px+11,py+39);
      c.stroke()
    }if(g.player===at){
      dot(c,px+25,py+25,16,'#b8a5ef');
      dot(c,px+20,py+22,2,'#20304b');
      dot(c,px+30,py+22,2,'#20304b')
    }
  }c.restore();text(c,'把每个箱子推到绿色圆点上',240,52,21);
  text(c,'只能推，不能拉 · 推错可以撤销',240,540,17,'#aebfda')
}
function drawSlide(c){
  if(!g.tiles)return;
  let cell=400/g.size;
  rect(c,34,74,412,412,'#25354e',12);
  for(let i=0;i<g.tiles.length;i++){
    let v=g.tiles[i],x=40+i%g.size*cell,y=80+Math.floor(i/g.size)*cell;
    rect(c,x+4,y+4,cell-8,cell-8,v?(v===(i+1)%g.tiles.length?'#59a9ac':'#6678bf'):'#14213a',8);
    if(v)text(c,v,x+cell/2,y+cell/2,Math.min(40,cell*.32))
  }text(c,'按顺序排列，最后一格留空',240,35,21);
  text(c,'点击空格旁的数字',240,535,19,'#aebfda')
}
</script></body></html>
